<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地客户控制台</title><link rel="stylesheet" href="/control.css"><script defer src="/lucide.min.js"></script><script defer src="/control.js"></script></head><body>
<header><strong>咚咚 · 本地客户控制台</strong><nav><a href="/manage" target="_blank">客服管理</a><a href="/workbench" target="_blank">客服工作台 <i data-lucide="external-link"></i></a></nav></header>
<main><aside><form id="create"><input name="name" placeholder="新客户昵称" required maxlength="80"><button title="创建客户"><i data-lucide="user-plus"></i></button></form><div id="customers"></div></aside>
<section><h1 id="customer-title">选择客户</h1><div id="history"></div><form id="inbound"><label for="template">问题模板</label><select id="template"><option value="">自定义消息</option></select><textarea name="text" rows="3" placeholder="客户消息" required maxlength="10000"></textarea><div class="send-row"><span id="status" role="status"></span><button type="submit"><i data-lucide="send"></i>发送客户消息</button></div></form></section></main>
</body></html>
