<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>咚咚工作站·本地复刻</title><link rel="stylesheet" href="/workbench.css"><script defer src="/lucide.min.js"></script><script defer src="/workbench.js"></script></head>
<body>
<div class="root"><div class="windows"><div class="container">
  <header id="t-body_header" class="theme-back-img">
    <img class="account-avatar" src="/avatar-agent.svg" alt="本地客服">
    <div class="rail-chat"><i data-lucide="message-circle-more"></i><span>聊天</span></div>
    <div class="rail-stats"><div><b class="today-count">0</b>今日咨询</div><div><b>0</b>未下单</div><div><b>0</b>待付款</div><div><b>0</b>已付款</div></div>
    <a class="rail-control" href="/control" target="_blank" title="本地客户控制台"><i data-lucide="sliders-horizontal"></i></a>
  </header>
  <div class="panel-content">
    <div class="ulist-wrap">
      <div id="t-ulist_search" class="search-wrap"><strong>本地测试客服</strong><div class="contact-search"><i data-lucide="search"></i><input id="t-search_input" placeholder="搜索联系人" autocomplete="off"></div></div>
      <div id="t-alluser-wrap" class="alluser-wrap"><div class="c_tabs c_tabs-pos_top">
        <div class="c_tabs-bar"><div class="c_tabs-nav-container">
          <div class="c_tabs-tab" title="正在咨询"><i data-lucide="message-square-more"></i></div>
          <div class="c_tabs-tab c_tabs-tab_check" title="历史咨询"><i data-lucide="history"></i></div>
          <div class="c_tabs-tab" title="常用联系人"><i data-lucide="user-round"></i></div>
          <div class="c_tabs-tab" title="群聊"><i data-lucide="users-round"></i></div>
          <div class="c_tabs-tab" title="组织架构"><i data-lucide="network"></i></div>
        </div></div>
        <div class="list-filter"><span class="connection-status"></span><label><input type="checkbox" class="unread-filter">仅未读</label></div>
        <div class="c_tabs-content">
          <div class="c_tabs-tabpane c_tabs-tab_inactive"><div class="list-compatible"><div class="c_stream"><div class="c_stream-content"></div></div></div></div>
          <div class="c_tabs-tabpane"><div class="recent-user-w"><div><div class="c_stream"><div class="c_stream-content"></div></div></div></div></div>
          <div class="c_tabs-tabpane c_tabs-tab_inactive"><div class="empty-list">暂无常用联系人</div></div>
          <div class="c_tabs-tabpane c_tabs-tab_inactive"><div class="empty-list">暂无群聊</div></div>
          <div class="c_tabs-tabpane c_tabs-tab_inactive"><div class="empty-list">本地测试客服</div></div>
        </div>
      </div></div>
      <div class="list-footer"><i data-lucide="contact-round"></i><i data-lucide="bot"></i><i data-lucide="headset"></i></div>
    </div>
    <div class="panel-content-left"><div class="chat-wrap">
      <div class="chat-head"><div class="chat-head-title"><div class="chat-head-name"></div><div class="chat-head-function"><span class="chat-transfer-tag t-f-ac" title="本地会话"><i data-lucide="corner-up-right"></i><span class="chat-transfer-desc">转接客户</span></span></div></div><div><div class="chat-product t-bf" hidden><span class="name over-elps"></span><span class="copy-link t-f-ac" title="复制商品名称">复制</span></div></div></div>
      <div class="chat-content-w">
        <div id="t-chat-scroll" class="chat-scroll-wrap"><div></div><div class="message-scroll-shell"><div class="c-wrap"><div class="c-c"></div></div></div></div>
        <div class="editor-hori-divider"></div>
        <div class="chat-foot"><div class="EditorWrapper">
          <ul class="quick-emoji-w t-quick-emoji"></ul>
          <div class="chat-foot-tool"><div class="tool-icon-w"><span class="tool-icon" title="表情"><i data-lucide="smile"></i></span></div><div class="tool-icon-w"><span class="tool-icon" title="图片（未接入）"><i data-lucide="image"></i></span></div><div class="tool-icon-w"><span class="tool-icon" title="文件（未接入）"><i data-lucide="folder-up"></i></span></div><div class="tool-icon-w"><span class="tool-icon" title="快捷短语"><i data-lucide="notebook-text"></i></span></div><div class="chat-foot-tool_right"><span class="tool-icon" title="历史咨询"><i data-lucide="history"></i></span></div></div>
          <div class="pell-editor-wrapper"><div class="EditorContent" contenteditable="true" spellcheck="false"><br></div></div>
          <div class="EditorFoot"><span class="send-error" role="status"></span><div class="SendButtonGroup t-color-1"><span class="send-button">发送</span><span class="SendButton-icon" title="发送快捷键"><i data-lucide="chevron-down"></i></span><div class="set-key-w" hidden><div class="t-item-h" data-mode="enter">按 Enter 发送</div><div class="t-item-h" data-mode="ctrl">按 Ctrl+Enter 发送</div></div></div></div>
        </div></div>
      </div>
    </div></div>
    <div class="phrase-wrap"><div class="phrase-tabs"><span class="active">个人短语</span><span>团队短语</span></div><div class="phrase-search"><i data-lucide="search"></i><input placeholder="搜索关键词/快捷短语"></div><div class="phrase-list"></div><div class="phrase-footer"><span>新建</span><span>导出</span><span>导入</span><span class="download">下载</span></div></div>
  </div>
  <div class="plugin-wrap"><div class="plugin-toolbar"><i data-lucide="plus"></i><i data-lucide="rotate-ccw"></i></div></div>
</div></div></div>
</body></html>
